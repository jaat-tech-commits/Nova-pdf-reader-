name: Build Offline 4K Camera APK

on:
  push:
    branches:
      - camera-app-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
          cache-disabled: true

      - name: Generate Gradle wrapper
        working-directory: offline4k-camera
        run: gradle --no-daemon wrapper --gradle-version 8.10 --distribution-type bin

      - name: Build debug APK
        working-directory: offline4k-camera
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          test -s offline4k-camera/app/build/outputs/apk/debug/app-debug.apk
          ls -lh offline4k-camera/app/build/outputs/apk/debug/app-debug.apk
          sha256sum offline4k-camera/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline4KCamera-debug
          path: offline4k-camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
