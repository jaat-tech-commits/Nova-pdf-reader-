name: Build Offline 4K Camera APK
on:
  workflow_dispatch:
  push:
    branches:
      - camera-app-v1
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -p offline4k-camera clean assembleDebug
      - name: Verify APK
        run: |
          test -s offline4k-camera/app/build/outputs/apk/debug/app-debug.apk
          ls -lh offline4k-camera/app/build/outputs/apk/debug/app-debug.apk
          sha256sum offline4k-camera/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline4KCamera-debug
          path: offline4k-camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
